name: Release (cross-lang publish matrix)

# Triggered when a git tag `vX.Y.Z` is pushed. Publishes the same version to:
#   - npm        (TypeScript)
#   - PyPI       (Python)
#   - crates.io  (Rust)
#   - Go module proxy via `go/vX.Y.Z` mirror tag
#
# Disciplina: todo release sai equalizado nos 4 langs. Antes era manual em 4 libs;
# agora `git tag v1.x.y && git push --tags` dispara tudo.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  verify:
    name: Verify version sync across libs
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - id: extract
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing version: $TAG"
      - name: Check npm package.json matches tag
        run: |
          PKG=$(node -p "require('./package.json').version")
          if [ "$PKG" != "${{ steps.extract.outputs.version }}" ]; then
            echo "::error::package.json version '$PKG' != tag 'v${{ steps.extract.outputs.version }}'"
            exit 1
          fi
      - name: Check pyproject.toml matches tag
        run: |
          VER=$(grep -E '^version = ' python/pyproject.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ "$VER" != "${{ steps.extract.outputs.version }}" ]; then
            echo "::error::pyproject.toml version '$VER' != tag 'v${{ steps.extract.outputs.version }}'"
            exit 1
          fi
      - name: Check Cargo.toml matches tag
        run: |
          VER=$(grep -E '^version = ' rust/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ "$VER" != "${{ steps.extract.outputs.version }}" ]; then
            echo "::error::Cargo.toml version '$VER' != tag 'v${{ steps.extract.outputs.version }}'"
            exit 1
          fi

  test:
    name: Tests must pass before publish
    needs: verify
    uses: ./.github/workflows/ci.yml

  publish-npm:
    name: npm publish
    needs: [verify, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pypi:
    name: PyPI publish
    needs: [verify, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: pip install build twine
      - run: cd python && python -m build
      - name: Upload to PyPI
        run: cd python && python -m twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}

  publish-crates:
    name: crates.io publish
    needs: [verify, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo publish
        # --allow-dirty: CI regenerates Cargo.lock during build (not tracked).
        # The diff is metadata-only; the published crate matches the tag.
        run: cd rust && cargo publish --allow-dirty --token ${{ secrets.CARGO_TOKEN }}

  publish-go-tag:
    name: Go module proxy (mirror tag `go/vX.Y.Z`)
    needs: [verify, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Create and push `go/vX.Y.Z` mirror tag
        run: |
          GO_TAG="go/v${{ needs.verify.outputs.version }}"
          # Idempotent: if mirror tag already exists, skip
          if git ls-remote --tags origin | grep -q "refs/tags/$GO_TAG$"; then
            echo "Tag $GO_TAG already exists; skipping."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$GO_TAG" "${GITHUB_REF#refs/tags/}" -m "Go SDK v${{ needs.verify.outputs.version }} (mirror of ${GITHUB_REF#refs/tags/})"
          git push origin "$GO_TAG"
      - name: Warm Go proxy
        run: |
          VER="v${{ needs.verify.outputs.version }}"
          curl -fsS "https://proxy.golang.org/github.com/shinydapps/l402-kit/go/@v/$VER.info" || true
