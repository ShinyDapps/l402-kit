name = "l402kit-api"
main = "src/worker.ts"
compatibility_date = "2026-04-24"
compatibility_flags = ["nodejs_compat"]
account_id = "08a1be0a8add759a13042f63b8a41b9a"

[vars]
ENVIRONMENT = "production"
# Endereços com acesso Pro vitalício — separados por vírgula, editável aqui
OWNER_ADDRESSES = "shinydapps@blink.sv"

# Secrets (set via: wrangler secret put VAR_NAME)
# SUPABASE_URL
# SUPABASE_ANON_KEY
# SUPABASE_SERVICE_KEY
# SPLIT_SECRET
# DASHBOARD_SECRET
# RESEND_API_KEY
# BLINK_API_KEY             ← shinydapps@blink.sv (conta principal)
# BLINK_WALLET_ID           ← shinydapps wallet ID
# BLINK_API_KEY_DEMO        ← +55 (demo/testes/sweep do transit)
# BLINK_WALLET_ID_DEMO      ← +55 wallet ID
# BLINK_WEBHOOK_SECRET
# OWNER_LIGHTNING_ADDRESS   ← destino do sweep (ex: shinydapps@blink.sv)

[triggers]
crons = ["*/30 * * * *"]

[[kv_namespaces]]
binding = "demo_preimages"
id = "cc84c53bdb464a1391313565ff920d16"

[[routes]]
pattern = "l402kit.com/docs"
zone_name = "l402kit.com"

[[routes]]
pattern = "l402kit.com/docs/*"
zone_name = "l402kit.com"

[[routes]]
pattern = "l402kit.com/api/*"
zone_name = "l402kit.com"

[[routes]]
pattern = "l402kit.com/.well-known/lnurlp/*"
zone_name = "l402kit.com"

[[routes]]
pattern = "l402kit.com/.well-known/agent.json"
zone_name = "l402kit.com"

[[routes]]
pattern = "l402kit.com/.well-known/l402.json"
zone_name = "l402kit.com"

[[routes]]
pattern = "l402kit.com/.well-known/402index-verify.txt"
zone_name = "l402kit.com"

[[routes]]
pattern = "l402kit.com/badge/*"
zone_name = "l402kit.com"

[[routes]]
pattern = "docs.l402kit.com/*"
zone_name = "l402kit.com"

[[routes]]
pattern = "l402kit.com/whitepaper-extended"
zone_name = "l402kit.com"


